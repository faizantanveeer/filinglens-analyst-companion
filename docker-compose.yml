name: fincite

services:
  api:
    build: { context: ., target: api }
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
    volumes: ["fincite-data:/data"]
    restart: unless-stopped

  ui:
    build:
      context: .
      target: ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000  # the browser calls the API directly
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  fincite-data:
